[package]
name = "tk_music_bot"
description = "TK-Music como bot de Discord: pone en un canal de voz la música de YouTube Music, con el motor de TK-Music."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tk-music-bot"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
env_logger.workspace = true
fastrand.workspace = true
futures.workspace = true
log.workspace = true
music.workspace = true
rodio.workspace = true
rustls.workspace = true
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "model", "utils", "rustls_backend", "voice"] }
songbird = { version = "0.6", features = ["serenity", "driver", "gateway", "rustls", "builtin-queue"] }
symphonia = { workspace = true }
