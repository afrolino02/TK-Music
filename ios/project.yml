# Proyecto de Xcode descrito como texto. XcodeGen lo convierte en SonoraMobile.xcodeproj en
# GitHub Actions, así que no hace falta una Mac para mantenerlo.
name: SonoraMobile
options:
  bundleIdPrefix: com.rprofe358
  deploymentTarget:
    iOS: "16.0"
packages:
  # La animación de entrada (splash.json, hecha en After Effects).
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.5.0
targets:
  SonoraMobile:
    type: application
    platform: iOS
    sources:
      - path: SonoraMobile
      - path: Shared
      # Los generan UniFFI a partir del crate `mobile`; no se editan a mano.
      - path: Generated
        excludes:
          - "*.modulemap"
    scheme: {}
    info:
      path: SonoraMobile/Info.plist
      properties:
        CFBundleDisplayName: TK-Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # la frase que suena en la isla dinámica y la pantalla bloqueada (Actividad en vivo)
        NSSupportsLiveActivities: true
        # La carpeta de Sonora aparece en la app Archivos, para copiar ahí la música.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad: todas las posiciones, para la pantalla dividida y Slide Over
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rprofe358.sonoramobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Generated/sonora_mobileFFI.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lsonora_mobile -lc++ -lsqlite3 -lresolv -lz
        DEAD_CODE_STRIPPING: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: TKMusicLive
      - package: Lottie
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
  # La Actividad en vivo: la frase que suena en la isla dinámica y en la pantalla bloqueada.
  TKMusicLive:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: LiveActivity
      - path: Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: TK-Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rprofe358.sonoramobile.live
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
